<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <title>Haushaltsbuch</title>
    <meta name="description" content="Gemeinsam Ausgaben erfassen, Budgets im Blick behalten und zusammen sparen." />
    <meta name="theme-color" content="#f6f5f2" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Haushaltsbuch" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Set theme before first paint to avoid a flash
      try {
        var d = JSON.parse(localStorage.getItem('ausgaben-app:v1') || 'null')
        var t = (d && d.settings && d.settings.theme) || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Bitte JavaScript aktivieren.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
